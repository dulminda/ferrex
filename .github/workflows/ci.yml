name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc-14, clang-18]
        preset: [debug, release, asan, tsan]
        include:
          - os: macos-15
            compiler: apple-clang
            preset: debug
          - os: macos-15
            compiler: apple-clang
            preset: asan

    steps:
      - uses: actions/checkout@v4

      - name: Select compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          if [ "${{ matrix.compiler }}" = "gcc-14" ]; then
            echo "CC=gcc-14"  >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq clang-18
            echo "CC=clang-18"    >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi
          # TSan on newer kernels fails with high ASLR entropy.
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -G Ninja

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18
          git ls-files '*.hpp' '*.cpp' | xargs clang-format-18 --dry-run --Werror

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-tidy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 clang-tidy-18 ninja-build
          CC=clang-18 CXX=clang++-18 cmake --preset debug -G Ninja
          git ls-files 'src/*.cpp' 'apps/*.cpp' | xargs clang-tidy-18 -p build/debug
